[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auxysecurity"
version = "1.1.2"
description = "Windows Guvenlik (Microsoft Defender) icin kontrol paneli: hizli anahtarlar, tarama yoneticisi, sifreli karantina kasasi, guvenlik duvari ve SmartScreen kontrolu"
readme = "README.md"
keywords = ["windows", "defender", "security", "quarantine", "firewall", "tray"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
]
requires-python = ">=3.12"
dependencies = ["pywin32>=306", "customtkinter>=5", "pystray>=0.19", "pillow>=10", "cryptography>=42", "watchdog>=4", "tkinterdnd2>=0.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3", "psutil>=5.9", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/auxydev/AuxySecurity"
Documentation = "https://github.com/auxydev/AuxySecurity/tree/main/docs"

[project.scripts]
auxy = "auxy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
